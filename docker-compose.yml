services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${DOMAIN}
      TRUST_PROXY: "1"
    volumes:
      - statusdata:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  statusdata:
  caddy_data:
  caddy_config:
